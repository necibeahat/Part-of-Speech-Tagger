name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Generate changelog
      id: changelog
      run: |
        # Simple changelog generation
        echo "## Changes" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          echo "Changes since $LAST_TAG:" >> CHANGELOG.md
          git log --oneline --pretty=format:"- %s" $LAST_TAG..HEAD >> CHANGELOG.md
        else
          echo "Initial release" >> CHANGELOG.md
          git log --oneline --pretty=format:"- %s" >> CHANGELOG.md
        fi
        
        echo "" >> CHANGELOG.md
        echo "## Files" >> CHANGELOG.md
        echo "- Source code (zip)" >> CHANGELOG.md
        echo "- Source code (tar.gz)" >> CHANGELOG.md
        
    - name: Create archive
      run: |
        # Create a clean archive without .git directory
        mkdir -p release-artifacts
        git archive --format=zip --prefix=part-of-speech-tagger/ HEAD > release-artifacts/part-of-speech-tagger-source.zip
        git archive --format=tar.gz --prefix=part-of-speech-tagger/ HEAD > release-artifacts/part-of-speech-tagger-source.tar.gz
        
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name || inputs.version }}
        release_name: Release ${{ github.ref_name || inputs.version }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
        
    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./release-artifacts/part-of-speech-tagger-source.zip
        asset_name: part-of-speech-tagger-source.zip
        asset_content_type: application/zip