name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz graphviz-dev
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
          
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black jupyter nbconvert
        
    - name: Download NLTK data
      run: |
        python -c "import nltk; nltk.download('brown'); nltk.download('universal_tagset')"
        
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Check code formatting with black
      run: |
        black --check --diff .
        
    - name: Test Python modules
      run: |
        python -c "import helpers; print('helpers.py imports successfully')"
        python -c "from helpers import read_data, read_tags, Dataset; print('Core functions import successfully')"
        
    - name: Validate Jupyter notebooks
      run: |
        jupyter nbconvert --to notebook --execute --inplace HiddenMarkovModelforPOS.ipynb || echo "Main notebook execution failed"
        jupyter nbconvert --to notebook --execute --inplace DownloadDataset.ipynb || echo "Dataset notebook execution failed"
        
    - name: Convert notebooks to HTML
      run: |
        jupyter nbconvert --to html HiddenMarkovModelforPOS.ipynb
        jupyter nbconvert --to html DownloadDataset.ipynb
        
    - name: Upload notebook artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: notebooks-python-${{ matrix.python-version }}
        path: |
          *.html
          *.ipynb
        retention-days: 30
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-python-${{ matrix.python-version }}
        path: |
          .coverage
          htmlcov/
        retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
        
    - name: Run safety check
      run: |
        safety check --json --output safety-report.json || true
        
    - name: Run bandit security scan
      run: |
        bandit -r . -f json -o bandit-report.json || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json
        retention-days: 30

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install quality tools
      run: |
        python -m pip install --upgrade pip
        pip install pylint mypy
        pip install -r requirements.txt
        
    - name: Run pylint
      run: |
        pylint helpers.py --output-format=json > pylint-report.json || true
        
    - name: Run mypy type checking
      run: |
        mypy helpers.py --ignore-missing-imports --json-report mypy-report || true
        
    - name: Upload code quality reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-quality-reports
        path: |
          pylint-report.json
          mypy-report/
        retention-days: 30

  documentation:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install documentation tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install jupyter nbconvert
        sudo apt-get update
        sudo apt-get install -y graphviz graphviz-dev
        
    - name: Download NLTK data
      run: |
        python -c "import nltk; nltk.download('brown'); nltk.download('universal_tagset')"
        
    - name: Generate documentation
      run: |
        # Convert notebooks to various formats
        jupyter nbconvert --to html HiddenMarkovModelforPOS.ipynb --output-dir docs/
        jupyter nbconvert --to html DownloadDataset.ipynb --output-dir docs/
        jupyter nbconvert --to pdf HiddenMarkovModelforPOS.ipynb --output-dir docs/ || echo "PDF conversion failed"
        
        # Create a simple index page
        mkdir -p docs
        cat > docs/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>NLP Part of Speech Tagging Project</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 40px; }
                h1 { color: #333; }
                .notebook-link { display: block; margin: 10px 0; padding: 10px; background: #f5f5f5; text-decoration: none; color: #333; }
                .notebook-link:hover { background: #e5e5e5; }
            </style>
        </head>
        <body>
            <h1>NLP Part of Speech Tagging Project Documentation</h1>
            <p>This project implements Hidden Markov Models for Part of Speech tagging.</p>
            <h2>Notebooks</h2>
            <a href="HiddenMarkovModelforPOS.html" class="notebook-link">Hidden Markov Model for POS Tagging</a>
            <a href="DownloadDataset.html" class="notebook-link">Download Dataset</a>
        </body>
        </html>
        EOF
        
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/
        retention-days: 90