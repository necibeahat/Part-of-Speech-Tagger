name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Dependency Review
      uses: actions/dependency-review-action@v3
      with:
        fail-on-severity: moderate

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install safety pip-audit
        
    - name: Run pip-audit
      run: |
        pip-audit --format=json --output=pip-audit-report.json || true
        
    - name: Run safety check
      run: |
        safety check --json --output=safety-audit-report.json || true
        
    - name: Upload security audit results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-audit-${{ github.run_number }}
        path: |
          pip-audit-report.json
          safety-audit-report.json
        retention-days: 90
        
    - name: Create security summary
      run: |
        echo "# Security Audit Summary" > security-summary.md
        echo "Generated on: $(date)" >> security-summary.md
        echo "" >> security-summary.md
        echo "## pip-audit Results" >> security-summary.md
        if [ -f pip-audit-report.json ]; then
          echo "pip-audit report generated successfully" >> security-summary.md
        else
          echo "pip-audit report generation failed" >> security-summary.md
        fi
        echo "" >> security-summary.md
        echo "## Safety Results" >> security-summary.md
        if [ -f safety-audit-report.json ]; then
          echo "Safety report generated successfully" >> security-summary.md
        else
          echo "Safety report generation failed" >> security-summary.md
        fi
        
    - name: Upload security summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary-${{ github.run_number }}
        path: security-summary.md
        retention-days: 90

  update-dependencies:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install pip-tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-tools
        
    - name: Create requirements.in from requirements.txt
      run: |
        cp requirements.txt requirements.in
        
    - name: Update dependencies
      run: |
        pip-compile --upgrade requirements.in
        
    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet requirements.txt; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Pull Request
      if: steps.changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: 'Automated dependency updates'
        body: |
          This PR contains automated dependency updates generated by GitHub Actions.
          
          Please review the changes and test thoroughly before merging.
          
          ## Changes
          - Updated package versions in requirements.txt
          
          ## Testing
          - [ ] All tests pass
          - [ ] Notebooks execute successfully
          - [ ] No breaking changes introduced
        branch: dependency-updates
        delete-branch: true